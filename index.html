<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Cat — Catálogo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#1E2A38;--ink-soft:#5B6B7A;--paper:#F5F0E6;--paper-light:#FFFDF8;--brass:#B8863E;--brass-dark:#8F6A2E;--brass-light:#D4A95A;--forest:#3D6B52;--forest-bg:#E4EDE7;--rust:#A8452F;--rust-bg:#F3E4DE;--border:#D9CFB8;--white:#FFFDF8;--black:#111;--shadow:0 2px 12px rgba(30,42,56,.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;}

  /* ===== ANIMATED CAT BACKGROUND ===== */
  .bg-cats{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.06;}
  .bg-cat{position:absolute;font-size:20px;animation:floatCat linear infinite;}
  @keyframes floatCat{
    0%{transform:translateY(110vh) rotate(0deg);}
    100%{transform:translateY(-20vh) rotate(360deg);}
  }

  .header{background:var(--black);text-align:center;padding:18px 16px 14px;position:sticky;top:0;z-index:40;}
  .header img{max-width:280px;height:auto;}
  .header-sub{color:#aaa;font-size:11px;margin-top:4px;letter-spacing:.08em;text-transform:uppercase;}
  .app{max-width:900px;margin:0 auto;padding:16px 12px 80px;position:relative;z-index:1;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .btn{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--paper-light);color:var(--ink-soft);transition:all .15s;font-family:inherit;}
  .btn:hover{border-color:var(--brass);color:var(--ink);}
  .btn.activo{background:var(--ink);color:var(--brass-light);border-color:var(--ink);}
  .btn-add{background:var(--brass);color:white;border:none;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-add:hover{background:var(--brass-dark);}
  .btn-back{background:none;border:1px solid var(--border);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;}
  .btn-back:hover{border-color:var(--brass);}
  .categorias-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;margin-top:10px;}
  @media(min-width:500px){.categorias-grid{grid-template-columns:repeat(3,1fr);}}
  .cat-card{background:var(--paper-light);border:1px solid var(--border);border-radius:12px;padding:24px 14px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
  .cat-icon{font-size:36px;margin-bottom:8px;}
  .cat-nombre{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;margin-bottom:3px;}
  .cat-count{font-size:12px;color:var(--ink-soft);}
  .buscador-wrap{position:relative;margin-bottom:16px;}
  .buscador{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);border-radius:20px;font-size:14px;font-family:inherit;background:var(--paper-light);color:var(--ink);outline:none;}
  .buscador:focus{border-color:var(--brass);}
  .buscador-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--ink-soft);pointer-events:none;}
  .buscador-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:2px 6px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .stat-box{background:var(--paper-light);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
  .stat-box .label{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .stat-box .val{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;}
  .seccion-header{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;margin:20px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--brass);color:var(--ink);}
  .catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-bottom:20px;}
  @media(min-width:600px){.catalogo{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}}
  .card{background:var(--paper-light);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .card-img{width:100%;aspect-ratio:1;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:40px;color:var(--ink-soft);}
  .card-img img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:10px 12px 12px;}
  .card-nombre{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-precio{font-size:16px;font-weight:700;color:var(--brass-dark);}
  .card-stock{font-size:11px;margin-top:4px;}
  .card-stock.disponible{color:var(--forest);}
  .card-stock.agotado{color:var(--rust);}
  .card-tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;background:var(--rust);color:white;}
  .overlay{position:fixed;inset:0;background:rgba(30,42,56,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:600px){.overlay{align-items:center;}}
  .modal{background:var(--paper-light);width:100%;max-width:500px;border-radius:14px 14px 0 0;padding:0;max-height:92vh;overflow-y:auto;}
  @media(min-width:600px){.modal{border-radius:12px;}}
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;}
  .modal-header h2{font-family:'Playfair Display',serif;font-size:20px;margin:0;}
  .modal-close{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}
  .modal-body{padding:16px 18px 22px;}
  .detail-img{width:100%;max-height:320px;object-fit:contain;border-radius:8px;background:var(--paper);margin-bottom:14px;}
  .detail-placeholder{width:100%;height:200px;background:var(--paper);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:14px;color:var(--ink-soft);}
  .detail-precio{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--brass-dark);margin-bottom:6px;}
  .detail-info{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}
  .detail-info b{color:var(--ink);}
  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .btn-vender{background:var(--forest);color:white;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-editar{background:var(--paper);color:var(--ink);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-eliminar{background:var(--rust-bg);color:var(--rust);border:1px solid var(--rust);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .campo{margin-bottom:13px;}
  .campo label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .campo input,.campo select,.campo textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--white);color:var(--ink);}
  .campo input:focus,.campo select:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-acciones{display:flex;gap:10px;margin-top:18px;}
  .btn-primario{flex:1;background:var(--ink);color:var(--paper-light);border:none;padding:11px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
  .btn-primario:hover{background:#111c28;}
  .btn-secundario{background:none;border:1px solid var(--border);color:var(--ink-soft);padding:11px 16px;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;}
  .error-msg{color:var(--rust);font-size:12px;margin-top:8px;}
  .imagen-picker{width:100%;min-height:130px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--white);cursor:pointer;margin-bottom:6px;}
  .imagen-preview{width:100%;max-height:200px;object-fit:contain;display:block;}
  .imagen-placeholder{text-align:center;color:var(--ink-soft);font-size:24px;padding:16px;}
  .imagen-placeholder span{display:block;margin-top:6px;font-size:12px;}
  .imagen-acciones{display:flex;gap:8px;margin-bottom:10px;}
  .imagen-acciones .btn-secundario{flex:1;padding:7px 6px;font-size:12px;}
  .stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:16px 0;}
  .stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:var(--white);font-size:18px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .stepper .num{font-family:'Playfair Display',serif;font-size:24px;min-width:40px;text-align:center;}
  .pedido-item{background:var(--paper-light);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;}
  .pedido-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .pedido-cliente{font-weight:600;font-size:15px;}
  .pedido-fecha{font-size:11px;color:var(--ink-soft);}
  .pedido-productos{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .pedido-totales{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;}
  .pedido-totales .ganancia{color:var(--forest);font-weight:600;}
  .pedido-totales .descuento{color:var(--rust);}
  .pedido-metodo{font-size:11px;color:var(--brass-dark);margin-top:4px;}
  .cart-badge{position:fixed;bottom:20px;right:20px;background:var(--brass);color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(184,134,62,.4);z-index:45;border:none;}
  .cart-count{position:absolute;top:-2px;right:-2px;background:var(--rust);color:white;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
  .cart-item-info{flex:1;}
  .cart-item-nombre{font-size:13px;font-weight:500;}
  .cart-item-precio{font-size:12px;color:var(--ink-soft);}
  .cart-item-qty{display:flex;align-items:center;gap:6px;}
  .cart-item-qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--white);font-size:14px;cursor:pointer;font-family:inherit;}
  .cart-item-qty span{font-weight:600;min-width:20px;text-align:center;}
  .cart-item-remove{background:none;border:none;color:var(--rust);cursor:pointer;font-size:16px;margin-left:8px;}
  .cart-total{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;text-align:right;margin-top:12px;padding-top:12px;border-top:2px solid var(--ink);}
  .btn-cancelar{background:var(--rust-bg);color:var(--rust);border:1px solid var(--rust);border-radius:4px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-edit-sm{background:var(--forest-bg);color:var(--forest);border:1px solid var(--forest);border-radius:4px;padding:4px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-right:4px;}
  .loading{text-align:center;padding:60px;color:var(--ink-soft);}
  .vacio{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .vacio p{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}
  .sin-resultados{text-align:center;padding:30px;color:var(--ink-soft);font-size:14px;}
  .cat-manage-btn{background:none;border:2px dashed var(--border);border-radius:12px;padding:24px 14px;text-align:center;cursor:pointer;color:var(--ink-soft);transition:border-color .15s;}
  .cat-manage-btn:hover{border-color:var(--brass);}
  @media(max-width:400px){.catalogo{grid-template-columns:repeat(2,1fr);gap:10px;}.stats{grid-template-columns:repeat(2,1fr);}.categorias-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

/* ===== SUPABASE ===== */
async function sbFetch(tabla,params,opts={}){
  const url=SB+'/'+tabla+(params?'?'+params:'');
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(url,{headers:{...SH,...(opts.headers||{})},method:opts.method||'GET',body:opts.body?JSON.stringify(opts.body):undefined,signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok)throw new Error(res.status);
    const text=await res.text();
    if(!text)return opts.method&&opts.method!=='GET'?true:[];
    return JSON.parse(text);
  }catch(e){clearTimeout(timer);throw e;}
}

/* ===== HELPERS ===== */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmt(n){return(Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function escA(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fechaCorta(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});}

/* ===== CATEGORIES ===== */
function getCategorias(){
  const base=new Set(['Pulseras','Aretes','Anillos','Collares','Accesorios']);
  if(S.config.categorias_custom) S.config.categorias_custom.forEach(c=>base.add(c));
  S.productos.forEach(p=>{if(p.categoria&&p.categoria!=='Otros')base.add(p.categoria);});
  const firstWords={};
  S.productos.forEach(p=>{
    if(p.categoria&&p.categoria!=='Otros')return;
    const fw=p.nombre.trim().split(/\s+/)[0];
    if(fw.length>=3){if(!firstWords[fw])firstWords[fw]=0;firstWords[fw]++;}
  });
  for(const[fw,count]of Object.entries(firstWords)){
    if(count>=3){const cat=detectarCategoria(fw+' x');if(cat)base.add(cat);}
  }
  base.add('Otros');
  return Array.from(base);
}
function getIcono(cat){return CAT_ICONOS[cat]||'📦';}
function productosEnCat(cat){
  return S.productos.filter(p=>{
    if(cat==='Otros')return!p.categoria||p.categoria==='Otros';
    return p.categoria===cat;
  });
}

/* ===== DATA ===== */
async function cargarDatos(){
  try{
    const[prods,ventas]=await Promise.all([
      sbFetch('productos','select=id,nombre,costo,precio_venta,cantidad,categoria,created_at&order=precio_venta'),
      sbFetch('ventas','select=id,producto_id,cantidad,fecha,cliente,descuento,precio_unitario,grupo,metodo_pago&order=fecha.desc')
    ]);
    S.productos=(prods||[]).map(p=>({...p,categoria:p.categoria||'Otros',_imgCargada:false,_imgData:null}));
    S.ventas=ventas||[];
    try{
      const cfgArr=await sbFetch('inventario','clave=eq.inventario-config');
      if(cfgArr&&cfgArr[0]&&cfgArr[0].valor){
        const cfg=JSON.parse(cfgArr[0].valor);
        S.config={...S.config,...cfg};
      }
      if(!S.config.categorias_custom)S.config.categorias_custom=[];
    }catch(e){}
    await autoCategorizar();
    if(S.modo==='admin'&&!S.config.password)S.modo='publico';
    S.loaded=true;
  }catch(e){console.error('Error cargando datos:',e);S.loaded=true;}
  render();
}

async function autoCategorizar(){
  const toUpdate=[];
  S.productos.forEach(p=>{
    if(p.categoria&&p.categoria!=='Otros')return;
    const cat=detectarCategoria(p.nombre);
    if(cat){p.categoria=cat;toUpdate.push(p);}
  });
  const firstWords={};
  S.productos.forEach(p=>{
    if(p.categoria&&p.categoria!=='Otros')return;
    const fw=p.nombre.trim().split(/\s+/)[0];
    if(fw.length>=3){if(!firstWords[fw])firstWords[fw]=[];firstWords[fw].push(p);}
  });
  for(const[fw,prods]of Object.entries(firstWords)){
    if(prods.length>=3){
      const catName=fw.charAt(0).toUpperCase()+fw.slice(1).toLowerCase();
      const existingCat=detectarCategoria(fw+' x');
      const finalCat=existingCat||catName;
      prods.forEach(p=>{p.categoria=finalCat;toUpdate.push(p);});
    }
  }
  if(toUpdate.length>0){
    for(let i=0;i<toUpdate.length;i+=20){
      const batch=toUpdate.slice(i,i+20);
      try{await Promise.all(batch.map(p=>sbFetch('productos','id=eq.'+p.id,{method:'PATCH',body:{categoria:p.categoria},headers:{'Prefer':'return=minimal'}})));}catch(e){}
    }
  }
}

/* ===== LAZY IMAGE LOADING ===== */
const imgQueue=[];
let imgLoading=0;
function encolarImagen(pid){
  const p=S.productos.find(x=>x.id===pid);
  if(!p||p._imgCargada||imgQueue.includes(pid))return;
  imgQueue.push(pid);
  procesarColaImg();
}
async function procesarColaImg(){
  while(imgLoading<3&&imgQueue.length>0){
    const pid=imgQueue.shift();
    const p=S.productos.find(x=>x.id===pid);
    if(!p||p._imgCargada)continue;
    imgLoading++;
    try{
      const arr=await sbFetch('productos','select=imagen&id=eq.'+pid);
      if(arr&&arr[0]){p._imgData=arr[0].imagen||'';p._imgCargada=true;}
      else p._imgCargada=true;
    }catch(e){p._imgCargada=true;}
    imgLoading--;
    const el=document.getElementById('img-'+pid);
    if(el) el.innerHTML=p._imgData?'<img src="'+escA(p._imgData)+'" loading="lazy">':'📦';
    const del=document.getElementById('detail-img-'+pid);
    if(del){
      if(p._imgData) del.outerHTML='<img class="detail-img" id="detail-img-'+pid+'" src="'+escA(p._imgData)+'">';
      else del.outerHTML='<div class="detail-placeholder" id="detail-img-'+pid+'">📦</div>';
    }
    procesarColaImg();
  }
}

/* ===== STOCK ===== */
function ventasDeP(pid){return S.ventas.filter(v=>v.producto_id===pid);}
function vendidos(pid){return ventasDeP(pid).reduce((s,v)=>s+v.cantidad,0);}
function stockP(p){return p.cantidad-vendidos(p.id);}

function pedirAcceso(){
  if(!S.config.password){
    const pass=prompt('Crea una contraseña para el modo administrador:');
    if(!pass)return;
    const conf=prompt('Confirma la contraseña:');
    if(pass!==conf){alert('Las contraseñas no coinciden.');return;}
    S.config.password=pass;guardarConfig();
    S.modo='admin';saveState();render();return;
  }
  const intento=prompt('Ingresa la contraseña de administrador:');
  if(intento===null)return;
  if(intento===S.config.password){S.modo='admin';saveState();render();}
  else alert('Contraseña incorrecta.');
}

/* ===== IMAGE HANDLING ===== */
function quitarImagen(){S.imagenEditando='';render();}
function manejarArchivo(e){const f=e.target.files&&e.target.files[0];if(f)procesarImagen(f);}
function manejarPegado(e){const items=(e.clipboardData||{}).items;if(!items)return;for(const item of items){if(item.type&&item.type.indexOf('image')!==-1){procesarImagen(item.getAsFile());e.preventDefault();break;}}}
function procesarImagen(file){
  const r=new FileReader();r.onload=function(e){
    const img=new Image();img.onload=function(){
      const max=800;let w=img.width,h=img.height;
      if(w>max||h>max){if(w>=h){h=Math.round(h*(max/w));w=max;}else{w=Math.round(w*(max/h));h=max;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      S.imagenEditando=c.toDataURL('image/jpeg',0.7);render();
    };img.src=e.target.result;
  };r.readAsDataURL(file);
}

/* ===== DB OPS ===== */
async function guardarProductoDB(p){
  await sbFetch('productos','on_conflict=id',{method:'POST',body:{
    id:p.id,nombre:p.nombre,imagen:p.imagen||'',costo:p.costo,
    precio_venta:p.precio_venta,cantidad:p.cantidad,categoria:p.categoria
  },headers:{'Prefer':'return=minimal,resolution=merge-duplicates'}});
}
async function eliminarProductoDB(id){await sbFetch('productos','id=eq.'+id,{method:'DELETE'});}
async function registrarVentasDB(items,cliente,descuento,metodo){
  const grupo=uid();
  for(const item of items){
    await sbFetch('ventas','',{method:'POST',body:{
      id:uid(),producto_id:item.productoId,cantidad:item.cantidad,
      fecha:new Date().toISOString(),cliente:cliente||null,
      descuento:descuento||0,precio_unitario:item.precioVenta,
      grupo,metodo_pago:metodo||'Efectivo'
    },headers:{'Prefer':'return=minimal'}});
  }
  return grupo;
}
async function cancelarVentaDB(id){await sbFetch('ventas','id=eq.'+id,{method:'DELETE'});}
async function actualizarVentaDB(id,data){
  await sbFetch('ventas','id=eq.'+id,{method:'PATCH',body:data,headers:{'Prefer':'return=minimal'}});
}
async function guardarConfig(){
  await sbFetch('inventario','on_conflict=clave',{method:'POST',body:{
    clave:'inventario-config',valor:JSON.stringify(S.config)
  },headers:{'Prefer':'return=minimal,resolution=merge-duplicates'}});
}

/* ===== CRUD ===== */
async function guardarProducto(){
  const nombre=document.getElementById('inp-nombre').value.trim();
  const costo=parseFloat(document.getElementById('inp-costo').value);
  const precio=parseFloat(document.getElementById('inp-precio').value);
  const cantidad=parseInt(document.getElementById('inp-cantidad').value,10);
  const categoria=document.getElementById('inp-categoria').value;
  const imagen=S.imagenEditando;
  const errBox=document.getElementById('form-error');
  if(!nombre||isNaN(costo)||isNaN(precio)||isNaN(cantidad)||cantidad<0||costo<0||precio<0){
    if(errBox)errBox.textContent='Revisa que todos los campos estén completos.';return;
  }
  try{
    if(S.modal==='editar'&&S.editId){
      const p=S.productos.find(x=>x.id===S.editId);
      if(p){p.nombre=nombre;p.costo=costo;p.precio_venta=precio;p.cantidad=cantidad;p.categoria=categoria;p._imgData=imagen;p._imgCargada=true;}
      await guardarProductoDB({id:S.editId,nombre,imagen,costo,precio_venta:precio,cantidad,categoria});
    }else{
      const id=uid();
      S.productos.push({id,nombre,costo,precio_venta:precio,cantidad,categoria,_imgData:imagen,_imgCargada:true,created_at:new Date().toISOString()});
      await guardarProductoDB({id,nombre,imagen,costo,precio_venta:precio,cantidad,categoria});
    }
    cerrarModal();
  }catch(e){if(errBox)errBox.textContent='Error: '+e.message;}
}
async function eliminarProducto(id){
  if(!confirm('¿Eliminar este producto y todas sus ventas?'))return;
  try{await eliminarProductoDB(id);S.productos=S.productos.filter(p=>p.id!==id);S.ventas=S.ventas.filter(v=>v.producto_id!==id);cerrarModal();}
  catch(e){alert('Error: '+e.message);}
}

/* ===== VENTAS ===== */
async function confirmarVenta(){
  const p=S.productos.find(x=>x.id===S.editId);if(!p)return;
  const rest=stockP(p),cant=Math.min(S.venderCantidad,rest);if(cant<=0)return;
  try{
    const grupo=await registrarVentasDB([{productoId:p.id,cantidad:cant,precioVenta:p.precio_venta}],'',0,'Efectivo');
    S.ventas.unshift({id:uid(),producto_id:p.id,cantidad:cant,fecha:new Date().toISOString(),cliente:'',descuento:0,precio_unitario:p.precio_venta,grupo,metodo_pago:'Efectivo'});
    cerrarModal();
  }catch(e){alert('Error: '+e.message);}
}
function cambiarStepper(d){
  const p=S.productos.find(x=>x.id===S.editId);const rest=p?stockP(p):0;
  S.venderCantidad=Math.max(1,Math.min(rest,S.venderCantidad+d));render();
}
async function cancelarVentasGrupo(gid){
  if(!confirm('¿Cancelar este pedido completo?'))return;
  const vs=S.ventas.filter(v=>(v.grupo||v.id)===gid);
  try{for(const v of vs)await cancelarVentaDB(v.id);S.ventas=S.ventas.filter(v=>(v.grupo||v.id)!==gid);render();}
  catch(e){alert('Error: '+e.message);}
}
async function eliminarVentaIndividual(vid){
  if(!confirm('¿Quitar este producto del pedido?'))return;
  try{await cancelarVentaDB(vid);S.ventas=S.ventas.filter(v=>v.id!==vid);render();}
  catch(e){alert('Error: '+e.message);}
}
async function cambiarCantidadVenta(vid,delta){
  const v=S.ventas.find(x=>x.id===vid);if(!v)return;
  const nuevaCant=v.cantidad+delta;
  if(nuevaCant<1){eliminarVentaIndividual(vid);return;}
  const p=S.productos.find(x=>x.id===v.producto_id);
  if(delta>0&&p){
    const totalVendOtras=S.ventas.filter(x=>x.producto_id===v.producto_id&&x.id!==vid).reduce((s,x)=>s+x.cantidad,0);
    if(totalVendOtras+nuevaCant>p.cantidad){alert('No hay más stock.');return;}
  }
  try{
    await actualizarVentaDB(vid,{cantidad:nuevaCant});
    v.cantidad=nuevaCant;render();
  }catch(e){alert('Error: '+e.message);}
}

/* ===== CARRITO ===== */
function agregarAlCarrito(pid){
  const p=S.productos.find(x=>x.id===pid);if(!p)return;
  const rest=stockP(p);if(rest<=0){alert('Producto agotado.');return;}
  const existe=S.carrito.find(c=>c.productoId===pid);
  if(existe){if(existe.cantidad<rest)existe.cantidad++;else alert('No hay más stock.');}
  else S.carrito.push({productoId:pid,nombre:p.nombre,precioVenta:p.precio_venta,cantidad:1});
  saveState();render();
}
function quitarDelCarrito(pid){S.carrito=S.carrito.filter(c=>c.productoId!==pid);saveState();render();}
function cambiarQtyCarrito(pid,d){
  const item=S.carrito.find(c=>c.productoId===pid);if(!item)return;
  const p=S.productos.find(x=>x.id===pid);const rest=p?stockP(p):1;
  item.cantidad=Math.max(1,Math.min(rest,item.cantidad+d));saveState();render();
}
async function confirmarPedido(){
  const cliente=document.getElementById('inp-cliente')?.value.trim()||'';
  const descuento=parseFloat(document.getElementById('inp-descuento')?.value)||0;
  const metodo=document.getElementById('inp-metodo')?.value||'Efectivo';
  if(S.carrito.length===0){alert('El carrito está vacío.');return;}
  try{
    const grupo=await registrarVentasDB(S.carrito,cliente,descuento,metodo);
    for(const item of S.carrito){
      S.ventas.unshift({id:uid(),producto_id:item.productoId,cantidad:item.cantidad,fecha:new Date().toISOString(),cliente,descuento,precio_unitario:item.precioVenta,grupo,metodo_pago:metodo});
    }
    S.carrito=[];S.carritoCliente='';S.carritoDescuento=0;saveState();
    cerrarModal();alert('¡Pedido registrado!');
  }catch(e){alert('Error: '+e.message);}
}

/* ===== TOTALS ===== */
function calcularTotales(){
  let invertido=0,cobrado=0,costoVendido=0,potencial=0;
  S.productos.forEach(p=>{
    const vend=vendidos(p.id),rest=p.cantidad-vend;
    invertido+=p.costo*p.cantidad;
    cobrado+=p.precio_venta*vend;
    costoVendido+=p.costo*vend;
    potencial+=(p.precio_venta-p.costo)*rest;
  });
  const grupos={};
  S.ventas.forEach(v=>{if(v.grupo&&v.descuento>0&&!grupos[v.grupo])grupos[v.grupo]=Number(v.descuento);});
  const totalDesc=Object.values(grupos).reduce((s,d)=>s+d,0);
  const gananciaReal=cobrado-costoVendido-totalDesc;
  return{invertido,cobrado,gananciaReal,potencial,totalDesc};
}

let renderTimer=null;
function render(){if(renderTimer)return;renderTimer=setTimeout(()=>{renderTimer=null;doRender();},16);}

function doRender(){
  const app=document.getElementById('app');
  if(!S.loaded){app.innerHTML='<div class="loading">Cargando catálogo…</div>';return;}
  const esAdmin=S.modo==='admin';
  let h='';

  if(esAdmin){
    h+='<div class="top-bar"><div style="display:flex;gap:6px;flex-wrap:wrap;">';
    h+='<button class="btn'+(S.vista==='home'||S.vista==='categoria'?' activo':'')+'" onclick="irHome()">📦 Catálogo</button>';
    h+='<button class="btn'+(S.vista==='pedidos'?' activo':'')+'" onclick="irPedidos()">🧾 Ventas</button>';
    h+='<button class="btn" onclick="cambiarPassword()">🔑</button>';
    h+='<button class="btn" onclick="cerrarAdmin()">🚪 Salir</button>';
    h+='</div><button class="btn-add" onclick="abrirNuevo()">+ Nuevo</button></div>';
  }else{
    h+='<div class="top-bar"><div></div><button class="btn" onclick="pedirAcceso()">🔒 Administrar</button></div>';
  }

  if(S.vista==='pedidos') h+=renderPedidos();
  else if(S.vista==='categoria'){if(esAdmin)h+=renderStats();h+=renderCatPage();}
  else{if(esAdmin)h+=renderStats();h+=renderHome(esAdmin);}

  h+=renderModales();
  app.innerHTML=h;

  // Cart badge
  if(esAdmin&&S.vista!=='pedidos'&&S.carrito.length>0){
    let b=document.getElementById('cart-badge');
    if(!b){b=document.createElement('button');b.id='cart-badge';b.className='cart-badge';b.onclick=abrirCarrito;document.body.appendChild(b);}
    b.innerHTML='🛒<span class="cart-count">'+S.carrito.length+'</span>';
  }else{const b=document.getElementById('cart-badge');if(b)b.remove();}

  if(S.vista==='categoria'){
    productosEnCat(S.categoriaActiva).forEach(p=>{if(!p._imgCargada)encolarImagen(p.id);});
  }
}

function renderStats(){
  const t=calcularTotales();
  const mostrarOcultos=S.finanzasDesbloqueado;
  let h='<div class="stats">';
  h+='<div class="stat-box"><div class="label">Productos</div><div class="val">'+S.productos.length+'</div></div>';

  if(mostrarOcultos){
    h+='<div class="stat-box"><div class="label">Invertido</div><div class="val">S/ '+fmt(t.invertido)+'</div></div>';
  }

  h+='<div class="stat-box"><div class="label">Cobrado (ventas)</div><div class="val" style="color:var(--brass-dark)">S/ '+fmt(t.cobrado)+'</div></div>';
  h+='<div class="stat-box"><div class="label">Ganancia real</div><div class="val" style="color:var(--forest)">S/ '+fmt(t.gananciaReal)+'</div></div>';

  if(mostrarOcultos){
    h+='<div class="stat-box"><div class="label">Ganancia potencial</div><div class="val">S/ '+fmt(t.potencial)+'</div></div>';
  }

  if(t.totalDesc>0) h+='<div class="stat-box"><div class="label">Descuentos</div><div class="val" style="color:var(--rust)">- S/ '+fmt(t.totalDesc)+'</div></div>';

  // Finance lock/unlock button
  if(mostrarOcultos){
    h+='<div class="stat-box" style="cursor:pointer;background:var(--forest-bg);" onclick="bloquearFinanzas()"><div class="label">Finanzas</div><div class="val" style="font-size:13px;">🔓 Ocultar</div></div>';
  }else{
    h+='<div class="stat-box" style="cursor:pointer;" onclick="desbloquearFinanzas()"><div class="label">Finanzas</div><div class="val" style="font-size:13px;">🔒 Ver todo</div></div>';
  }

  h+='</div>';
  return h;
}

function renderHome(esAdmin){
  const cats=getCategorias();
  let h='<div class="seccion-header">Secciones</div><div class="categorias-grid">';

    h+='<div class="cat-card" onclick="irCategoria(\''+escA(cat)+'\')">';

function renderCatPage(){
  const cat=S.categoriaActiva;
  let prods=productosEnCat(cat);
  let h='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">';
  h+='<button class="btn-back" onclick="irHome()">← Volver</button>';
  h+='<span class="seccion-header" style="margin:0;border:none;flex:1;">'+esc(cat)+' <span style="font-size:14px;color:var(--ink-soft);font-family:Inter,sans-serif;font-weight:400;">('+prods.length+')</span></span>';
  h+='</div>';
  h+='<div class="buscador-wrap"><span class="buscador-icon">🔍</span>';
  h+='<input class="buscador" type="text" placeholder="Buscar en '+escA(cat)+'..." value="'+escA(S.busqueda)+'" oninput="buscar(this.value)">';
  if(S.busqueda) h+='<button class="buscador-clear" onclick="buscar(\'\')">✕</button>';
  h+='</div>';

  if(S.busqueda){const q=S.busqueda.toLowerCase();prods=prods.filter(p=>p.nombre.toLowerCase().includes(q));}
  prods.sort((a,b)=>(a.precio_venta||0)-(b.precio_venta||0));
  if(prods.length===0){h+='<div class="sin-resultados">No se encontraron productos.</div>';return h;}

  h+='<div class="catalogo">';
  prods.forEach(p=>{
    const st=stockP(p),agotado=st<=0;
    h+='<div class="card" onclick="abrirDetalle(\''+escA(p.id)+'\')">';
    if(agotado) h+='<span class="card-tag">Agotado</span>';
    h+='<div class="card-img" id="img-'+p.id+'">';
    h+=p._imgCargada?(p._imgData?'<img src="'+escA(p._imgData)+'" loading="lazy">':'📦'):'<span style="font-size:12px;color:var(--ink-soft)">⏳</span>';
    h+='</div><div class="card-body">';
    h+='<div class="card-nombre">'+esc(p.nombre)+'</div>';
    h+='<div class="card-precio">S/ '+fmt(p.precio_venta)+'</div>';
    h+='<div class="card-stock '+(agotado?'agotado':'disponible')+'">'+(agotado?'Sin stock':st+' disponible'+(st===1?'':'s'))+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

function renderPedidos(){
  const grupos={};
  S.ventas.forEach(v=>{
    const g=v.grupo||v.id;
    if(!grupos[g])grupos[g]={ventas:[],cliente:v.cliente||'',descuento:Number(v.descuento)||0,fecha:v.fecha,metodo:v.metodo_pago||''};
    grupos[g].ventas.push(v);
  });
  const lista=Object.entries(grupos).sort((a,b)=>new Date(b[1].fecha)-new Date(a[1].fecha));
  let h='<h2 style="font-family:Playfair Display,serif;margin-bottom:16px;">Historial de ventas</h2>';
  if(lista.length===0){h+='<div class="vacio"><p>No hay ventas registradas</p></div>';return h;}

  lista.forEach(([gid,pedido])=>{
    let subtotal=0,costoTotal=0,prodsHtml='';
    pedido.ventas.forEach(v=>{
      const p=S.productos.find(x=>x.id===v.producto_id);
      const nombre=p?p.nombre:'(eliminado)';
      const costo=p?p.costo:0;
      const precioU=v.precio_unitario||(p?p.precio_venta:0);
      subtotal+=precioU*v.cantidad;costoTotal+=costo*v.cantidad;
      prodsHtml+=v.cantidad+'x '+esc(nombre)+' — S/ '+fmt(precioU*v.cantidad)+'<br>';
    });
    const ganancia=subtotal-costoTotal-(pedido.descuento||0);
    h+='<div class="pedido-item">';
    h+='<div class="pedido-header"><div>';
    h+='<div class="pedido-cliente">'+(pedido.cliente?'👤 '+esc(pedido.cliente):'Venta directa')+'</div>';
    h+='<div class="pedido-fecha">'+fechaCorta(pedido.fecha)+'</div>';
    h+='</div><div>';
    h+='<button class="btn-edit-sm" onclick="abrirEditarPedido(\''+escA(gid)+'\')">✎ Editar</button>';
    h+='<button class="btn-cancelar" onclick="cancelarVentasGrupo(\''+escA(gid)+'\')">Cancelar</button>';
    h+='</div></div>';
    h+='<div class="pedido-productos">'+prodsHtml+'</div>';
    if(pedido.metodo) h+='<div class="pedido-metodo">💳 '+esc(pedido.metodo)+'</div>';
    h+='<div class="pedido-totales">';
    h+='<span>Cobrado: <b>S/ '+fmt(subtotal)+'</b></span>';
    if(pedido.descuento>0) h+='<span class="descuento">Desc: -S/ '+fmt(pedido.descuento)+'</span>';
    h+='<span class="ganancia">Ganancia: S/ '+fmt(ganancia)+'</span>';
    h+='</div></div>';
  });
  return h;
}

    });
    let subtotal=0;vs.forEach(v=>{subtotal+=(v.precio_unitario||0)*v.cantidad;});
    h+='<div class="cart-total">Total: S/ '+fmt(subtotal)+'</div>';
    h+='<div class="modal-acciones"><button class="btn-secundario" style="flex:1" onclick="cerrarModal()">Listo</button></div>';
    h+='</div></div></div>';
  }

  return h;
}

document.addEventListener('paste',function(e){if(S.modal==='nuevo'||S.modal==='editar')manejarPegado(e);});

cargarDatos();
</script>
