<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Manifiesto de Inventario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1E2A38;
    --ink-soft:#5B6B7A;
    --paper:#EAE3D2;
    --paper-light:#F7F3E8;
    --brass:#B8863E;
    --brass-dark:#8F6A2E;
    --forest:#3D6B52;
    --forest-bg:#E4EDE7;
    --rust:#A8452F;
    --rust-bg:#F3E4DE;
    --border:#D9CFB8;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:720px;margin:0 auto;padding:26px 12px 70px;}

  /* Libro */
  .libro{
    background:var(--paper-light);
    border:1px solid var(--border);
    border-left:8px solid var(--ink);
    border-radius:3px 14px 14px 3px;
    box-shadow:3px 6px 18px rgba(30,42,56,.18), 0 0 0 1px rgba(30,42,56,.02);

    position:relative;
  }
  .libro::before{
    content:'';position:absolute;left:-3px;top:10px;bottom:10px;width:3px;

  }
  .libro.tapa{
    background:var(--ink);color:var(--paper-light);border-left-color:var(--brass);
  }
  .libro.tapa .masthead{border-bottom-color:var(--brass);}
  .libro.tapa .masthead p, .libro.tapa .stamp{color:#B9C3CD;}
  .libro.tapa .stamp b{color:var(--paper-light);}
  .libro.tapa .indice-titulo{color:#B9C3CD;}
  .libro.tapa .indice-item{border-bottom-color:rgba(255,255,255,.14);}
  .libro.tapa .indice-item:hover{background:rgba(255,255,255,.06);}
  .libro.tapa .indice-nombre{color:var(--paper-light);}
  .libro.tapa .indice-stock{color:#B9C3CD;}
  .libro.tapa .indice-num{color:var(--brass);}

  .folio{text-align:center;font-family:'Fraunces',serif;font-style:italic;font-size:12px;color:var(--ink-soft);margin-top:16px;}

  /* Header */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);

  .masthead h1{
    font-family:'Fraunces',serif;

  .masthead p{margin:2px 0 0;color:var(--ink-soft);font-size:13px;}
  .stamp{text-align:right;font-size:12px;color:var(--ink-soft);}
  .stamp b{display:block;font-family:'Fraunces',serif;font-size:20px;color:var(--ink);font-weight:600;}

  /* Totals row */
  .totales{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .totales .box{background:var(--paper-light);border:1px solid var(--border);border-radius:3px;padding:10px 12px;}
  .totales .box .label{font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
  .totales .box .val{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink);}

  /* Candado de costos */
  .candado-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:16px;}
  .candado-btn{
    display:flex;align-items:center;gap:6px;background:var(--paper-light);

  /* Add button */
  .add-btn{
    width:100%;padding:12px;background:var(--ink);color:var(--paper-light);
    border:none;border-radius:3px;font-size:14px;font-weight:600;cursor:pointer;
    margin-bottom:22px;font-family:'Inter',sans-serif;transition:background .15s;
  }
  .add-btn:hover{background:#111c28;}

  /* Índice (portada) */
  .buscador-wrap{position:relative;margin-bottom:16px;}
  .buscador{
    width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);border-radius:20px;
    font-size:14px;font-family:'Inter',sans-serif;background:var(--paper-light);color:var(--ink);
    outline:none;transition:border-color .15s;

  .buscador-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--ink-soft);pointer-events:none;}

  .indice-titulo{font-family:'Fraunces',serif;font-size:14px;color:var(--ink-soft);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;}
  .indice{border-top:1px solid var(--border);}
  .indice-item{

  .vacio p{font-family:'Fraunces',serif;font-size:18px;color:var(--ink);margin-bottom:6px;}

  /* Página de producto (librito) */
  .pagina-nav-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .link-indice{background:none;border:none;color:var(--brass-dark);font-size:13px;font-weight:600;cursor:pointer;padding:0;}
  .pagina-contador{font-size:12px;color:var(--ink-soft);font-style:italic;font-family:'Fraunces',serif;}

  .pagina-nombre{font-family:'Fraunces',serif;font-size:21px;font-weight:600;margin:0 0 12px;}
  .thumb{
    width:100%;height:260px;border-radius:6px;border:1px solid var(--border);
    background:var(--white);display:flex;align-items:center;justify-content:center;
    overflow:hidden;color:var(--ink-soft);font-size:56px;margin-bottom:14px;padding:10px;

  .thumb img{width:100%;height:100%;object-fit:contain;}
  .precios{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .precios b{color:var(--ink);}
  .barra-wrap{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .barra{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .barra-fill{height:100%;background:var(--brass);}
  .stock-txt{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .fila-acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}

  .agotado-tag{display:inline-block;background:var(--rust-bg);color:var(--rust);font-size:11px;font-weight:600;padding:4px 10px;border-radius:3px;}
  .ganancia-total{text-align:right;font-size:12px;color:var(--ink-soft);margin-left:auto;}
  .ganancia-total b{display:block;font-family:'Fraunces',serif;font-size:15px;color:var(--forest);}
  .link-historial{background:none;border:none;color:var(--brass-dark);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;margin-bottom:18px;display:inline-block;}

  .pagina-nav-bottom{
    display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--border);padding-top:16px;margin-top:6px;
  }
  .btn-pagina{background:none;border:1px solid var(--border);color:var(--ink);padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-pagina:disabled{opacity:.35;cursor:not-allowed;}
  .btn-pagina:not(:disabled):hover{border-color:var(--brass);}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(30,42,56,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:600px){.overlay{align-items:center;}}

  @media(min-width:600px){.modal{border-radius:8px;}}

  .campo{margin-bottom:13px;}
  .campo label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .campo input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:'Inter',sans-serif;background:var(--white);color:var(--ink);}

  .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-acciones{display:flex;gap:10px;margin-top:18px;}
  .btn-primario{flex:1;background:var(--ink);color:var(--paper-light);border:none;padding:11px;border-radius:4px;font-weight:600;font-size:14px;cursor:pointer;}
  .btn-secundario{background:none;border:1px solid var(--border);color:var(--ink-soft);padding:11px 16px;border-radius:4px;font-size:14px;cursor:pointer;}
  .error-msg{color:var(--rust);font-size:12px;margin-top:8px;}

  .stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin:16px 0;}
  .stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:var(--white);font-size:18px;cursor:pointer;color:var(--ink);}
  .stepper .num{font-family:'Fraunces',serif;font-size:24px;min-width:40px;text-align:center;}

  /* Historial */
  .venta-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .venta-item .fecha{color:var(--ink-soft);font-size:11.5px;display:block;}
  .btn-cancelar-venta{background:var(--rust-bg);color:var(--rust);border:1px solid var(--rust);border-radius:3px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .sin-ventas{text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13.5px;}

  /* Selector de imagen */
  .imagen-picker{
    width:100%;min-height:150px;border:2px dashed var(--border);border-radius:6px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--white);cursor:pointer;margin-bottom:8px;
  }
  .imagen-picker:focus{outline:2px solid var(--brass);outline-offset:2px;}
  .imagen-preview{width:100%;max-height:230px;object-fit:contain;display:block;}
  .imagen-placeholder{text-align:center;color:var(--ink-soft);font-size:26px;padding:20px;}
  .imagen-placeholder span{display:block;margin-top:8px;font-size:12px;line-height:1.4;}

  .loading{text-align:center;padding:60px;color:var(--ink-soft);}
</style>

<script>
const state = {
  productos: [],
  loaded: false,
  pagina: 0,
  modal: null,
  editId: null,
  venderCantidad: 1,
  config: { password: null },
  costoVisible: true,
  imagenEditando: '',
  busqueda: '',
};

const STORAGE_KEY = 'inventario-productos';
const CONFIG_KEY = 'inventario-config';

// ── Supabase ──
const SUPABASE_URL = 'https://ulsimleeftbtakovwuqo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsc2ltbGVlZnRidGFrb3Z3dXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTM5NTAsImV4cCI6MjEwNDY4OTk1MH0.PQCkmKbZW7Sl0K56MJ4JL_dMRcVBpZBsNccH4lehWAY';
let sb;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){ sb = null; }

function fmt(n){
  const v = Number(n)||0;
  return v.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function uid(){ return 'p'+Date.now()+Math.random().toString(36).slice(2,7); }
function vendidosDe(p){ return (p.ventas||[]).reduce((s,v)=>s+v.cantidad,0); }

// ── Migración automática: mueve datos de la tabla vieja "inventario" a las nuevas tablas ──
async function migrarDatosViejos(){
  try{
    const { data } = await sb.from('inventario').select('valor').eq('clave', STORAGE_KEY).maybeSingle();
    if(!data || !data.valor) return;
    const viejos = JSON.parse(data.valor);
    if(!viejos.length) return;
    // Verificar si ya hay productos en la tabla nueva
    const { count } = await sb.from('productos').select('id', { count: 'exact', head: true });
    if(count > 0) return; // Ya se migró antes

    for(const p of viejos){
      const ventas = p.ventas || [];
      if(p.vendidos && p.vendidos > 0 && ventas.length === 0){
        ventas.push({ id: 'legacy-'+p.id, cantidad: p.vendidos, fecha: null });
      }
      await sb.from('productos').upsert({
        id: p.id,
        nombre: p.nombre || '',
        imagen: p.imagen || '',
        costo: p.costoInicial || 0,
        precio_venta: p.costoFinal || 0,
        cantidad: p.cantidadInicial || 0
      });
      for(const v of ventas){
        await sb.from('ventas').upsert({
          id: v.id,
          producto_id: p.id,
          cantidad: v.cantidad,
          fecha: v.fecha || new Date().toISOString()
        });
      }
    }
    console.log('Migración completada:', viejos.length, 'productos');
  }catch(e){ console.warn('Error en migración:', e.message); }
}

// ── Cargar datos desde tablas organizadas ──
async function cargarDatos(){
  try{
    // Primero intentar migrar datos viejos
    await migrarDatosViejos();

    // Leer productos
    const { data: prods, error: e1 } = await sb.from('productos').select('*').order('created_at');
    if(e1) throw e1;

    // Leer ventas
    const { data: vtas, error: e2 } = await sb.from('ventas').select('*').order('fecha');
    if(e2) throw e2;

    // Armar la estructura que el render espera
    state.productos = (prods || []).map(p => ({
      id: p.id,
      nombre: p.nombre,
      imagen: p.imagen || '',
      costoInicial: Number(p.costo) || 0,
      costoFinal: Number(p.precio_venta) || 0,
      cantidadInicial: p.cantidad || 0,
      ventas: (vtas || []).filter(v => v.producto_id === p.id).map(v => ({
        id: v.id,
        cantidad: v.cantidad,
        fecha: v.fecha
      }))
    }));

    // Config (password) — la dejamos en la tabla inventario
    try{
      const { data: cfg } = await sb.from('inventario').select('valor').eq('clave', CONFIG_KEY).maybeSingle();
      if(cfg) state.config = JSON.parse(cfg.valor);
    }catch(e){}
  }catch(e){
    console.error('Error cargando datos:', e.message);
    state.productos = [];
  }
  state.costoVisible = !state.config.password;
  state.loaded = true;
  render();
}

// ── Guardar/actualizar un producto ──
async function guardarProductoEnDB(p){
  const { error } = await sb.from('productos').upsert({
    id: p.id,
    nombre: p.nombre,
    imagen: p.imagen || '',
    costo: p.costoInicial,
    precio_venta: p.costoFinal,
    cantidad: p.cantidadInicial
  });
  if(error){ console.error('Error guardando producto:', error); return false; }
  return true;
}

// ── Eliminar producto ──
async function eliminarProductoEnDB(id){
  const { error } = await sb.from('productos').delete().eq('id', id);
  if(error){ console.error('Error eliminando:', error); return false; }
  return true;
}

// ── Registrar venta ──
async function registrarVentaEnDB(venta){
  const { error } = await sb.from('ventas').insert({
    id: venta.id,
    producto_id: venta.producto_id,
    cantidad: venta.cantidad,
    fecha: venta.fecha
  });
  if(error){ console.error('Error en venta:', error); return false; }
  return true;
}

// ── Cancelar venta ──
async function cancelarVentaEnDB(ventaId){
  const { error } = await sb.from('ventas').delete().eq('id', ventaId);
  if(error){ console.error('Error cancelando venta:', error); return false; }
  return true;
}

// ── Guardar config ──
async function guardarConfig(){
  try{
    await sb.from('inventario').upsert(
      { clave: CONFIG_KEY, valor: JSON.stringify(state.config) },
      { onConflict: 'clave' }
    );
    return true;
  }catch(e){ return false; }
}

// Estas funciones ya no se usan pero las dejo para no romper nada
async function guardarDatos(){ return true; }

/* Buscador */
function buscarProducto(texto){
  state.busqueda = texto;
  render();
  // Re-enfocar el input después del render
  setTimeout(()=>{
    const input = document.querySelector('.buscador');
    if(input){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }, 0);
}

/* Navegación tipo libro */
function irAPortada(){ state.pagina = 0; render(); }
function irAProducto(idx){ state.pagina = idx + 1; render(); }
function paginaSiguiente(){ if(state.pagina < state.productos.length){ state.pagina++; render(); } }
function paginaAnterior(){ if(state.pagina > 0){ state.pagina--; render(); } }

/* Modales */
function abrirNuevo(){ state.modal = 'nuevo'; state.editId = null; state.imagenEditando = ''; render(); }
function abrirEditar(id){
  state.modal = 'editar'; state.editId = id;
  const p = state.productos.find(x=>x.id===id);
  state.imagenEditando = p ? (p.imagen || '') : '';
  render();
}
function abrirVender(id){ state.modal = 'vender'; state.editId = id; state.venderCantidad = 1; render(); }
function abrirHistorial(id){ state.modal = 'historial'; state.editId = id; render(); }
function cerrarModal(){ state.modal = null; state.editId = null; state.imagenEditando = ''; render(); }

/* Imagen: subir o pegar (sin URLs) */
function quitarImagen(){ state.imagenEditando = ''; render(); }

function manejarArchivoImagen(event){
  const file = event.target.files && event.target.files[0];
  if(file) procesarArchivoImagen(file);
}

function manejarPegado(event){
  const items = (event.clipboardData || (window.clipboardData || {})).items;
  if(!items) return;
  for(const item of items){
    if(item.type && item.type.indexOf('image') !== -1){
      const file = item.getAsFile();
      if(file) procesarArchivoImagen(file);
      event.preventDefault();
      break;
    }
  }
}

function procesarArchivoImagen(file){
  const lector = new FileReader();
  lector.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.imagenEditando = canvas.toDataURL('image/jpeg', 0.8);
      render();
    };
    img.src = e.target.result;
  };
  lector.readAsDataURL(file);
}

/* Candado de costos */
function maskCosto(valorTexto){
  return state.costoVisible ? valorTexto : '<span class="oculto-txt">•••••</span>';
}
function toggleCostos(){
  if(state.costoVisible){ state.costoVisible = false; render(); return; }
  if(!state.config.password){
    const pass = prompt('Crea una contraseña para proteger tus costos:');
    if(!pass) return;
    const confirmar = prompt('Confirma la contraseña:');
    if(pass !== confirmar){ alert('Las contraseñas no coinciden. Inténtalo de nuevo.'); return; }
    state.config.password = pass;
    guardarConfig();
    state.costoVisible = true;
    render();
    return;
  }
  const intento = prompt('Ingresa tu contraseña para ver los costos:');
  if(intento === null) return;
  if(intento === state.config.password){ state.costoVisible = true; render(); }
  else alert('Contraseña incorrecta.');
}
function cambiarPassword(){
  if(state.config.password){
    const actual = prompt('Ingresa tu contraseña actual:');
    if(actual === null) return;
    if(actual !== state.config.password){ alert('Contraseña incorrecta.'); return; }
  }
  const nueva = prompt('Escribe la nueva contraseña:');
  if(!nueva) return;
  const confirmar = prompt('Confirma la nueva contraseña:');
  if(nueva !== confirmar){ alert('Las contraseñas no coinciden.'); return; }
  state.config.password = nueva;
  guardarConfig();
  alert('Contraseña actualizada.');
}

/* CRUD de productos */
async function guardarProducto(){
  const nombre = document.getElementById('input-nombre').value.trim();
  const imagen = state.imagenEditando;
  const costoInicial = parseFloat(document.getElementById('input-costoInicial').value);
  const costoFinal = parseFloat(document.getElementById('input-costoFinal').value);
  const cantidad = parseInt(document.getElementById('input-cantidad').value, 10);

  const errBox = document.getElementById('form-error');
  if(!nombre || isNaN(costoInicial) || isNaN(costoFinal) || isNaN(cantidad) || cantidad < 0 || costoInicial < 0 || costoFinal < 0){
    if(errBox) errBox.textContent = 'Revisa que todos los campos estén completos y sean válidos.';
    return;
  }

  let producto;
  if(state.modal === 'editar' && state.editId){
    producto = state.productos.find(x=>x.id===state.editId);
    if(producto){
      producto.nombre = nombre;
      producto.imagen = imagen;
      producto.costoInicial = costoInicial;
      producto.costoFinal = costoFinal;
      producto.cantidadInicial = cantidad;
    }
  } else {
    producto = {
      id: uid(), nombre, imagen, costoInicial, costoFinal,
      cantidadInicial: cantidad, ventas: [],
    };
    state.productos.push(producto);
  }

  const ok = await guardarProductoEnDB(producto);
  if(!ok){
    if(state.modal !== 'editar') state.productos.pop();
    if(errBox) errBox.textContent = 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
    return;
  }
  cerrarModal();
}

async function eliminarProducto(id){
  if(!confirm('¿Eliminar este producto del inventario? Esta acción no se puede deshacer.')) return;
  const ok = await eliminarProductoEnDB(id);
  if(!ok){
    alert('No se pudo eliminar el producto. Revisa tu conexión e inténtalo de nuevo.');
    return;
  }
  state.productos = state.productos.filter(p=>p.id!==id);
  state.pagina = 0;
  render();
}

/* Ventas */
async function confirmarVenta(){
  const p = state.productos.find(x=>x.id===state.editId);
  if(!p) return;
  const restante = p.cantidadInicial - vendidosDe(p);
  const cant = Math.min(state.venderCantidad, restante);
  if(cant <= 0) return;
  const venta = { id: uid(), producto_id: p.id, cantidad: cant, fecha: new Date().toISOString() };
  const ok = await registrarVentaEnDB(venta);
  if(!ok){
    alert('No se pudo registrar la venta. Revisa tu conexión e inténtalo de nuevo.');
    return;
  }
  p.ventas.push({ id: venta.id, cantidad: cant, fecha: venta.fecha });
  cerrarModal();
}
function cambiarStepper(delta){
  const p = state.productos.find(x=>x.id===state.editId);
  const restante = p ? p.cantidadInicial - vendidosDe(p) : 0;
  state.venderCantidad = Math.max(1, Math.min(restante, state.venderCantidad + delta));
  render();
}
async function cancelarVenta(productoId, ventaId){
  const p = state.productos.find(x=>x.id===productoId);
  if(!p) return;
  if(!confirm('¿Cancelar esta venta? La cantidad vuelve a estar disponible en el inventario.')) return;
  const ok = await cancelarVentaEnDB(ventaId);
  if(!ok){
    alert('No se pudo cancelar la venta. Revisa tu conexión e inténtalo de nuevo.');
    return;
  }
  p.ventas = p.ventas.filter(v=>v.id!==ventaId);
  render();
}
function fechaCorta(iso){
  if(!iso) return 'Venta anterior';
  const d = new Date(iso);
  return d.toLocaleDateString('es-PE',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
}

function calcularTotales(){
  let invertido = 0, gananciaRealizada = 0, gananciaPotencial = 0;
  state.productos.forEach(p=>{
    const vendidos = vendidosDe(p);
    const restante = p.cantidadInicial - vendidos;
    const gananciaUnit = p.costoFinal - p.costoInicial;
    invertido += p.costoInicial * p.cantidadInicial;
    gananciaRealizada += gananciaUnit * vendidos;
    gananciaPotencial += gananciaUnit * restante;
  });
  return { invertido, gananciaRealizada, gananciaPotencial };
}

/* Render */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = '<div class="loading">Cargando inventario…</div>'; return; }

  if(state.pagina > state.productos.length) state.pagina = 0;

  const esPortada = state.pagina === 0;
  const contenido = esPortada ? renderPortada() : renderPaginaProducto(state.pagina - 1);
  const folio = esPortada ? '' : `<div class="folio">— ${state.pagina} de ${state.productos.length} —</div>`;

  let html = `<div class="libro${esPortada ? ' tapa' : ''}">${contenido}${folio}</div>`;
  html += renderModales();
  app.innerHTML = html;
}

function renderPortada(){
  const { invertido, gananciaRealizada, gananciaPotencial } = calcularTotales();
  let html = `
    <div class="masthead">
      <div>
        <h1>Manifiesto de Inventario</h1>
        <p>Control de importaciones y ventas</p>
      </div>
      <div class="stamp">Productos<b>${state.productos.length}</b></div>
    </div>

    <div class="totales">
      <div class="box"><div class="label">Invertido</div><div class="val">${maskCosto('S/ '+fmt(invertido))}</div></div>
      <div class="box ganancia"><div class="label">Ganancia real</div><div class="val">S/ ${fmt(gananciaRealizada)}</div></div>
      <div class="box"><div class="label">Ganancia por cobrar</div><div class="val">S/ ${fmt(gananciaPotencial)}</div></div>
    </div>

    <div class="candado-row">
      ${(state.costoVisible && state.config.password) ? '<button class="cambiar-pass" onclick="cambiarPassword()">cambiar contraseña</button>' : ''}
      <button class="candado-btn" onclick="toggleCostos()">${state.costoVisible ? '🔓 Ocultar costos' : '🔒 Mostrar costos'}</button>
    </div>

    <button class="add-btn" onclick="abrirNuevo()">+ Agregar producto</button>
  `;

  if(state.productos.length === 0){
    html += `<div class="vacio"><p>Tu inventario está vacío</p>Agrega tu primer producto para empezar a llevar el control.</div>`;
  } else {
    html += `
      <div class="buscador-wrap">
        <span class="buscador-icon">🔍</span>
        <input class="buscador" type="text" placeholder="Buscar producto..." value="${escapeAttr(state.busqueda)}" oninput="buscarProducto(this.value)">
        ${state.busqueda ? '<button class="buscador-clear" onclick="buscarProducto(\'\')">✕</button>' : ''}
      </div>
    `;

    const termino = state.busqueda.toLowerCase();
    const filtrados = state.productos.map((p, idx) => ({ p, idx })).filter(({ p }) =>
      !termino || p.nombre.toLowerCase().includes(termino)
    );

    if(filtrados.length === 0){
      html += '<div class="sin-resultados">No se encontraron productos con "' + escapeHtml(state.busqueda) + '"</div>';
    } else {
      html += '<p class="indice-titulo">Índice — toca un producto para ver su página</p><div class="indice">';
      filtrados.forEach(({ p, idx })=>{
        const restante = p.cantidadInicial - vendidosDe(p);
        html += `
          <button class="indice-item" onclick="irAProducto(${idx})">
            <span class="indice-num">${idx+1}.</span>
            <span class="indice-nombre">${escapeHtml(p.nombre)}</span>
            <span class="indice-stock">${restante <= 0 ? 'Agotado' : restante + ' disp.'}</span>
          </button>
        `;
      });
      html += '</div>';
    }
  }
  return html;
}

function renderPaginaProducto(idx){
  const p = state.productos[idx];
  if(!p) return renderPortada();
  const vendidos = vendidosDe(p);
  const restante = p.cantidadInicial - vendidos;
  const gananciaUnit = p.costoFinal - p.costoInicial;
  const gananciaTotal = gananciaUnit * vendidos;
  const pct = p.cantidadInicial > 0 ? (restante / p.cantidadInicial) * 100 : 0;
  const agotado = restante <= 0;
  const total = state.productos.length;

  return `
    <div class="pagina-nav-top">
      <button class="link-indice" onclick="irAPortada()">📖 Índice</button>
    </div>

    <p class="pagina-nombre">${escapeHtml(p.nombre)}</p>
    <div class="thumb">${p.imagen ? `<img src="${escapeAttr(p.imagen)}" onerror="this.parentElement.innerHTML='📦'">` : '📦'}</div>

    <div class="precios">Costo <b>${maskCosto('S/ '+fmt(p.costoInicial))}</b> · Venta <b>S/ ${fmt(p.costoFinal)}</b> · Ganancia/u <b>${maskCosto('S/ '+fmt(gananciaUnit))}</b></div>

    <div class="barra-wrap">
      <div class="barra"><div class="barra-fill" style="width:${pct}%"></div></div>
      <span class="stock-txt">${restante} de ${p.cantidadInicial}</span>
    </div>

    <div class="fila-acciones">
      ${agotado ? '<span class="agotado-tag">Agotado</span>' : `<button class="btn-vender" onclick="abrirVender('${p.id}')">Vender</button>`}
      <button class="btn-icon" onclick="abrirEditar('${p.id}')" title="Editar">✎</button>
      <button class="btn-icon" onclick="eliminarProducto('${p.id}')" title="Eliminar">✕</button>
      <div class="ganancia-total">Ganancia obtenida<b>S/ ${fmt(gananciaTotal)}</b></div>
    </div>

    <button class="link-historial" onclick="abrirHistorial('${p.id}')">Ver historial de ventas (${p.ventas.length})</button>

    <div class="pagina-nav-bottom">
      <button class="btn-pagina" onclick="paginaAnterior()" ${idx===0 ? 'disabled' : ''}>‹ Anterior</button>
      <button class="btn-pagina" onclick="paginaSiguiente()" ${idx===total-1 ? 'disabled' : ''}>Siguiente ›</button>
    </div>
  `;
}

function renderModales(){
  let html = '';

  if(state.modal === 'nuevo' || state.modal === 'editar'){
    const p = state.modal === 'editar' ? state.productos.find(x=>x.id===state.editId) : null;
    html += `
      <div class="overlay" onclick="if(event.target===this) cerrarModal()">
        <div class="modal">
          <h2>${p ? 'Editar producto' : 'Nuevo producto'}</h2>
          <div>
            <div class="campo">
              <label>Nombre del producto</label>
              <input id="input-nombre" type="text" value="${p ? escapeAttr(p.nombre) : ''}" placeholder="Ej. Audífonos inalámbricos">
            </div>
            <div class="campo">
              <label>Imagen del producto</label>
              <div class="imagen-picker" tabindex="0" onclick="document.getElementById('input-imagen-file').click()">
                ${state.imagenEditando
                  ? `<img src="${state.imagenEditando}" class="imagen-preview">`
                  : `<div class="imagen-placeholder">📷<span>Toca para elegir una foto,<br>o pégala con Ctrl+V</span></div>`
                }
              </div>
              <input type="file" id="input-imagen-file" accept="image/*" style="display:none" onchange="manejarArchivoImagen(event)">
              <div class="imagen-acciones">
                <button type="button" class="btn-secundario" onclick="document.getElementById('input-imagen-file').click()">📁 Elegir foto</button>
                ${state.imagenEditando ? '<button type="button" class="btn-secundario" onclick="quitarImagen()">✕ Quitar</button>' : ''}
              </div>
            </div>
            <div class="fila2">
              <div class="campo">
                <label>Costo inicial (S/)</label>
                <input id="input-costoInicial" type="number" step="0.01" min="0" value="${p ? p.costoInicial : ''}">
              </div>
              <div class="campo">
                <label>Precio de venta (S/)</label>
                <input id="input-costoFinal" type="number" step="0.01" min="0" value="${p ? p.costoFinal : ''}">
              </div>
            </div>
            <div class="campo">
              <label>Cantidad ${p ? 'total' : 'inicial'}</label>
              <input id="input-cantidad" type="number" min="0" value="${p ? p.cantidadInicial : ''}">
            </div>
            <div class="error-msg" id="form-error"></div>
            <div class="modal-acciones">
              <button type="button" class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
              <button type="button" class="btn-primario" onclick="guardarProducto()">Guardar</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  if(state.modal === 'vender'){
    const p = state.productos.find(x=>x.id===state.editId);
    const restante = p ? p.cantidadInicial - vendidosDe(p) : 0;
    html += `
      <div class="overlay" onclick="if(event.target===this) cerrarModal()">
        <div class="modal">
          <h2>Registrar venta — ${p ? escapeHtml(p.nombre) : ''}</h2>
          <p style="color:var(--ink-soft);font-size:13px;margin:0;">Quedan ${restante} unidades disponibles.</p>
          <div class="stepper">
            <button onclick="cambiarStepper(-1)">−</button>
            <span class="num">${state.venderCantidad}</span>
            <button onclick="cambiarStepper(1)">+</button>
          </div>
          <div class="modal-acciones">
            <button class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-primario" onclick="confirmarVenta()">Confirmar venta</button>
          </div>
        </div>
      </div>
    `;
  }

  if(state.modal === 'historial'){
    const p = state.productos.find(x=>x.id===state.editId);
    html += `
      <div class="overlay" onclick="if(event.target===this) cerrarModal()">
        <div class="modal">
          <h2>Historial de ventas — ${p ? escapeHtml(p.nombre) : ''}</h2>
    `;
    if(!p || p.ventas.length === 0){
      html += '<div class="sin-ventas">Todavía no se registran ventas.</div>';
    } else {
      [...p.ventas].reverse().forEach(v=>{
        html += `
          <div class="venta-item">
            <span>${v.cantidad} unidad${v.cantidad===1?'':'es'}<span class="fecha">${fechaCorta(v.fecha)}</span></span>
            <button class="btn-cancelar-venta" onclick="cancelarVenta('${p.id}','${v.id}')">Cancelar</button>
          </div>
        `;
      });
    }
    html += `
          <div class="modal-acciones">
            <button class="btn-secundario" style="flex:1" onclick="cerrarModal()">Cerrar</button>
          </div>
        </div>
      </div>
    `;
  }

  return html;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeAttr(s){
  return String(s).replace(/"/g,'&quot;');
}

document.addEventListener('paste', function(event){
  if(state.modal === 'nuevo' || state.modal === 'editar'){
    manejarPegado(event);
  }
});

cargarDatos();
</script>
</body>
</html>
